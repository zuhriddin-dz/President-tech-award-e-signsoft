name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  ci:
    runs-on: ubuntu-latest
    env:
      # Dummy values so env contracts parse; integration specs skip themselves
      # when the database is not a real Neon instance.
      CLERK_SECRET_KEY: sk_test_ci_dummy_0000000000
      APP_DATABASE_URL: postgresql://ci:ci@localhost:5432/ci
      S3_ENDPOINT: https://ci.invalid
      S3_BUCKET: ci
      S3_ACCESS_KEY_ID: ci
      S3_SECRET_ACCESS_KEY: ci
      REDIS_URL: redis://127.0.0.1:6390/0
      ESIGN_SEAL_KEYS: '[{"kid":"ci-seal","privateKeyPkcs8Pem":"-----BEGIN PRIVATE KEY-----\nMC4CAQAwBQYDK2VwBCIEIIhGPuLP7SanD5fScAHdBqw3RX9ZZU5XxkV7jMvqPJP5\n-----END PRIVATE KEY-----\n","state":"active"}]'
      RESEND_API_KEY: re_ci_dummy
      EMAIL_FROM: DocFlow <onboarding@resend.dev>
      SIGN_APP_URL: http://localhost:3300
      ESIGN_LINK_TTL_DAYS: '14'
      SIGN_RELAY_SECRET: ci_dummy_relay_secret_at_least_32_bytes_long
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4 # reads the version from packageManager

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm build

      - run: pnpm test

      # lint chains security-lint — the tenant-isolation gate fails the build
      - run: pnpm lint
